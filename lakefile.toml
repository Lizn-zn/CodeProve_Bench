name = "CodeVerif-Lean4"
version = "0.1.0"
keywords = ["verification", "formal-methods"]
defaultTargets = ['CodeVerifBenchmark']

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git" 
rev = "v4.22.0"

[[lean_lib]]
name = "CodeVerifBenchmark"

[[lean_lib]]
name = "Tools"

[[lean_exe]]
name = "check-deps"
root = "Tools.CheckDeps"

[[lean_exe]]
name = "check-rec"
root = "Tools.CheckRec"

