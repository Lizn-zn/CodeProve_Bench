name = "CodeVerif-Lean4"
version = "0.1.0"
keywords = ["verification", "formal-methods"]
defaultTargets = ['CodeVerifBenchmark']

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git" 
rev = "v4.22.0"

[[lean_lib]]
name = "CodeVerifBenchmark"

